<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"><title>سيتيSiti GPS</title>
<link rel="stylesheet" href="leaflet.css" crossorigin=""/>
<style>
:root{--base:#080e1d;--panel:#101b31;--edge:#2b3e59;--ink:#eef6ff;--muted:#849dbb;--cyan:#22ecd9;--orange:#ff9c39;--pink:#fb4d9d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--base);color:var(--ink);font-family:system-ui,'Segoe UI',sans-serif}body.light{--base:#dfe9f2;--panel:#f4f9ff;--edge:#a7b7cc;--ink:#122742;--muted:#526d87;--cyan:#028c99;--orange:#b96615;--pink:#b32473}.shell{height:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px;gap:9px;overflow:hidden;background:radial-gradient(circle at 42% 20%,rgba(24,113,179,.18),transparent 38%),var(--base)}header{height:42px;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{display:flex;align-items:center;gap:9px}.mark{width:38px;height:38px;border-radius:11px;padding:2px;background:linear-gradient(120deg,#18eadf,#8066ff,#ff469d,#15dce6);background-size:250% 250%;animation:shine 5s linear infinite}.mark img{height:100%;width:100%;object-fit:cover;border-radius:9px}.brand{font-size:22px;font-weight:1000;letter-spacing:.1px;background:linear-gradient(90deg,#1ef1dd,#8e83ff,#ff54c1,#16ffbd);background-size:300%;color:transparent;background-clip:text;animation:shine 6s linear infinite}.sub{font-size:10px;letter-spacing:1px;color:var(--muted)}@keyframes shine{0%{background-position:0% 50%}100%{background-position:100% 50%}}.tiny{font-size:11px;color:var(--muted)}.pill{border:1px solid var(--edge);border-radius:12px;padding:7px 12px;background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer}.status{display:flex;gap:7px;align-items:center}.dot{height:8px;width:8px;border-radius:50%;background:#ffb343}.dot.ok{background:#18e0ad}.board{flex:1;min-height:0;display:grid;grid-template-columns:40% minmax(0,60%);grid-template-areas:'gauges map';gap:10px;direction:ltr}.gauges,.mapcol{min-height:0;min-width:0;direction:rtl}.gauges{grid-area:gauges;display:flex;flex-direction:column;gap:8px}.mapcol{grid-area:map;display:flex;flex-direction:column;gap:8px}.panel{border:1px solid var(--edge);border-radius:16px;background:linear-gradient(160deg,rgba(45,68,108,.16),transparent 60%),var(--panel);overflow:hidden}.speed{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}.title{font-size:12px;color:var(--muted);letter-spacing:1.6px;text-align:center}.dial{width:min(100%,33vh);max-height:100%;aspect-ratio:1;position:relative;display:grid;place-items:center}.dial svg{width:100%;height:100%;overflow:visible;transform:rotate(140deg)}.dial .value{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center}.big{font-size:clamp(28px,7vh,64px);font-weight:850;line-height:1.05;direction:ltr;font-variant-numeric:tabular-nums}.unit{font-size:13px;color:var(--cyan)}.meta{width:100%;display:flex;justify-content:space-around;font-size:11px;color:var(--muted)}.meta b{display:block;color:var(--ink);font-size:15px}.minigauges{height:31%;min-height:104px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.mini strong{font-size:clamp(17px,4.1vh,32px);color:var(--cyan);direction:ltr}.mini:nth-child(2) strong{color:var(--orange)}.mapframe{flex:1;min-height:0;position:relative}.map{height:100%;width:100%;background:#192638}.mapctrl{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px;direction:rtl}.mapctrl button{font-size:11px;padding:6px 9px}.compass{position:absolute;left:12px;top:12px;z-index:500;background:#0b1523dc;border:1px solid #4b7291;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font-weight:900;color:#f06267;direction:ltr}.mapbar{display:flex;gap:6px;direction:rtl;align-items:center}input{min-width:0;outline:0;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px;color:var(--ink);flex:1;font-size:12px}input::placeholder{color:var(--muted)}button{font-family:inherit;cursor:pointer}.primary{background:linear-gradient(120deg,#00cbbd,#42a4db);color:#081225;border:0;font-weight:800;padding:10px;border-radius:10px}.footer{min-height:50px;max-height:50px;display:flex;gap:8px;align-items:center}.music{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:6px 10px}.music label{font-size:11px;color:var(--muted);white-space:nowrap}.music input{padding:8px}.music button{padding:7px 10px}.soundframe{display:none;position:absolute;bottom:60px;right:10px;width:min(440px,90vw);height:190px;z-index:700;background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow:hidden}.soundframe.visible{display:block}.soundframe iframe{border:0;width:100%;height:100%}.footer .coords{font-size:10px;color:var(--muted);direction:ltr;white-space:nowrap}.carpin{width:34px;height:34px;background:linear-gradient(135deg,#15ead8,#187aff);border-radius:50% 50% 50% 6px;box-shadow:0 0 0 5px #00cdbd30,0 0 20px #0cf5df;display:grid;place-items:center;border:2px solid white}.carpin span{font-size:20px;display:block;transform:rotate(-45deg)}.leaflet-container{font-family:inherit}.note{position:absolute;bottom:10px;left:10px;right:10px;pointer-events:none;z-index:500;background:#051322d5;color:#f5faff;padding:5px;border-radius:8px;font-size:11px;text-align:center}.mapcol .title{display:none}@media(max-width:700px) and (orientation:portrait){.shell{gap:5px;padding:5px}header{height:34px;min-height:34px}.mark{height:30px;width:30px}.brand{font-size:17px}.board{grid-template-columns:39% minmax(0,61%);gap:5px}.minigauges{min-height:96px;height:28%;gap:4px}.dial{width:100%}.big{font-size:clamp(25px,6vw,40px)}.title{font-size:10px}.footer{min-height:42px;max-height:42px}.footer .coords{display:none}.music label{display:none}.mapbar{flex-wrap:wrap}.mapbar input{flex-basis:100%}.mapbar button{flex:1;padding:6px}.mapframe{min-height:0}.tiny{font-size:9px}.status .tiny{display:none}}@media(max-height:430px){.shell{padding:5px;gap:5px}header{height:30px;min-height:30px}.mark{width:27px;height:27px}.brand{font-size:16px}.dial{width:min(100%,43vh)}.minigauges{height:34%;min-height:75px}.footer{min-height:36px;max-height:36px}.mapbar input,.mapbar button{padding:6px}.music{padding:3px 5px}.music input{padding:5px}.title{font-size:10px}}@media(prefers-reduced-motion:reduce){.mark,.brand{animation:none}}
</style><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="neon-v2.css"><link rel="stylesheet" href="keyboard.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="dj.css"><style>
#siti-intro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,#35205e,#080d20 70%);color:#fff;transition:opacity .25s ease}
#siti-intro .mark{width:132px;height:132px;padding:4px;border-radius:32px;box-shadow:0 0 60px #b439ff88,0 0 110px #00e5ff33;animation:shine 2s linear infinite,intro-breathe 2s ease-in-out infinite}
#siti-intro img{border-radius:28px}#siti-intro .brand{font-size:44px}#siti-intro .loading{font-size:15px;letter-spacing:5px;direction:ltr;color:#cbd5f5}
#siti-intro .load-track{width:180px;height:3px;border-radius:5px;overflow:hidden;background:#30364f}#siti-intro .load-track:after{content:'';display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#00e5ff,#a855ff,#ff28d7);animation:intro-progress 5s linear both}
@keyframes intro-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes intro-breathe{50%{transform:scale(1.06)}}
@media(orientation:landscape) and (max-height:500px){#siti-intro{gap:12px}#siti-intro .mark{width:90px;height:90px}#siti-intro .brand{font-size:32px}}
@media(prefers-reduced-motion:reduce){#siti-intro *,#siti-intro *:after{animation:none!important;transition:none!important}}
</style></head><body><div id="siti-intro" role="status" aria-label="تحميل سيتي"><div class="mark"><img src="profile.svg" alt="شعار سيتي"></div><div class="brand"><bdi>سيتيSiti</bdi></div><div class="loading">loading</div><div class="load-track" aria-hidden="true"></div></div><script>setTimeout(function(){var x=document.getElementById('siti-intro');if(x)x.remove()},5000);</script><div class="shell">
<header><div class="logo"><div class="mark"><img src="profile.svg" alt="شعار سيتي"></div><div><div class="brand"><bdi>سيتيSiti</bdi></div><div class="sub">برمجة وتصميم سيتيSiti</div></div></div><div class="status"><div class="dot" id="dot"></div><div class="tiny" id="gpsState">بانتظار GPS</div><button class="pill" id="themeBtn">☾ / ☀</button></div></header>
<div class="board"><section class="gauges"><div class="panel speed"><div class="title">GPS SPEED</div><div class="dial"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="99" fill="none" stroke="#2b3957" stroke-width="12" stroke-dasharray="455 622" stroke-linecap="round"/><circle id="progress" cx="120" cy="120" r="99" fill="none" stroke="#0ff0d2" stroke-width="12" stroke-dasharray="0 622" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #06cfbd)"/></svg><div class="value"><div class="big" id="speed">0</div><div class="unit">km/h</div></div></div><div class="meta"><div>أعلى سرعة <b id="maxSpeed">0</b></div><div>مسافة الرحلة <b id="distance">0.00 km</b></div><div>دقة الموقع <b id="accuracy">—</b></div></div></div><div class="minigauges"><div class="panel mini"><div class="title">اتجاه الحركة</div><strong id="heading">—°</strong><div class="tiny" id="headingText">غير متوفر</div></div><div class="panel mini"><div class="title">التسارع التقريبي</div><strong id="accel">0.00</strong><div class="tiny">m/s² (GPS)</div></div></div></section>
<section class="mapcol"><div class="mapframe panel"><div id="map" class="map"></div><div class="compass">N ↑</div><div class="mapctrl"><button class="pill" id="followBtn">تتبّع ✓</button><button class="pill" id="northBtn">اتجاه ↑</button></div><div class="note" id="mapNote">الخريطة تحتاج اتصال إنترنت. اضغط السماح بالوصول للموقع.</div></div><div class="mapbar"><input id="destination" placeholder="ابحث عن وجهة أو عنوان..." aria-label="الوجهة"><button class="primary" id="searchBtn">بحث</button><button class="pill" id="routeBtn">مسار داخل الخريطة</button></div></section></div>
<div class="footer"><div class="panel music"><label>♫ SoundCloud</label><input id="scUrl" placeholder="رابط أغنية أو قائمة SoundCloud" aria-label="SoundCloud URL"><button class="primary" id="playBtn">▶</button><button class="pill" id="musicToggle">♫</button></div><button class="pill" id="resetBtn">تصفير</button><div class="coords" id="coords">GPS Offline</div></div><div id="soundFrame" class="soundframe"><iframe id="scFrame" title="SoundCloud player" allow="autoplay"></iframe></div></div>
<script src="leaflet.js"></script><script src="leaflet-rotate.js"></script>
<script>
const el=id=>document.getElementById(id); let map,marker,routeLine,heading=0,loc=null,last=null,total=0,maxSpeed=0,lastSpeed=null,lastTime=null,follow=true,headingUp=false,dest=null,routeResult=null;const RAD=Math.PI/180;
function state(t,ok){el('gpsState').textContent=t;el('dot').classList.toggle('ok',!!ok)}
function markerIcon(angle){const bearing=map&&map.getBearing?map.getBearing():0;return L.divIcon({className:'',html:`<div class="carpin" style="transform:rotate(${angle+bearing}deg)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L21 21L12 16L3 21Z" fill="white"/></svg></div>`,iconSize:[34,34],iconAnchor:[17,17]})}
function init(){if(typeof L==='undefined'){el('mapNote').textContent='تعذّر تحميل الخريطة. تحقق من اتصال الإنترنت.';return}map=L.map('map',{zoomControl:false,rotate:true,bearing:0,touchRotate:true,dragRotate:false,rotateControl:false}).setView([31.9539,35.9106],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);map.on('dragstart',()=>{follow=false;el('followBtn').textContent='تتبّع';});setTimeout(()=>map.invalidateSize(),250);el('mapNote').textContent='موقعك المباشر يظهر بعد منح إذن GPS';}
function hav(a,b){const φ1=a.lat*RAD,φ2=b.lat*RAD,dφ=(b.lat-a.lat)*RAD,dλ=(b.lng-a.lng)*RAD,q=Math.sin(dφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;return 6371*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function update(p){let c=p.coords,now=p.timestamp,lat=c.latitude,lng=c.longitude;loc={lat,lng};let v=Number.isFinite(c.speed)&&c.speed>=0?c.speed:null;let kmh=v===null?0:v*3.6;if(last && hav(last,loc)<.3 && c.accuracy<100){let d=hav(last,loc);if(d*1000>Math.max(2,c.accuracy*.18))total+=d;}last=loc;
if(Number.isFinite(c.heading)&&c.heading>=0 && kmh>3){heading=c.heading;el('heading').textContent=Math.round(heading)+'°';el('headingText').textContent='من بيانات GPS';}else if(kmh<3){el('headingText').textContent='آخر اتجاه معروف';}
if(lastSpeed!==null&&v!==null&&lastTime!==null&&now>lastTime){let a=(v-lastSpeed)/((now-lastTime)/1000);if(Math.abs(a)<20)el('accel').textContent=a.toFixed(2);}if(v!==null){lastSpeed=v;lastTime=now}
maxSpeed=Math.max(maxSpeed,kmh);el('speed').textContent=Math.round(kmh);el('maxSpeed').textContent=Math.round(maxSpeed);el('distance').textContent=total.toFixed(2)+' km';el('accuracy').textContent=Math.round(c.accuracy)+'m';el('progress').setAttribute('stroke-dasharray',Math.min(kmh/240,1)*455+' 622');el('coords').textContent=lat.toFixed(5)+', '+lng.toFixed(5);state('GPS مباشر',true);el('mapNote').style.display='none';if(map){if(!marker)marker=L.marker([lat,lng],{icon:markerIcon(heading)}).addTo(map);else{marker.setLatLng([lat,lng]);marker.setIcon(markerIcon(heading));}if(follow)map.setView([lat,lng],Math.max(map.getZoom(),15),{animate:false});}}
function startGps(){if(!navigator.geolocation){state('GPS غير مدعوم',false);return;}navigator.geolocation.watchPosition(p=>update(p),e=>state('GPS: '+e.message,false),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});}
async function search(){let q=el('destination').value.trim();if(!q)return;el('searchBtn').textContent='...';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q));let a=await r.json();if(!a.length)throw Error('لم يتم العثور على الوجهة');dest={lat:+a[0].lat,lng:+a[0].lon};if(map){L.marker([dest.lat,dest.lng]).addTo(map).bindPopup(a[0].display_name).openPopup();map.setView([dest.lat,dest.lng],14)}el('mapNote').style.display='block';el('mapNote').textContent='تم العثور على الوجهة. اضغط مسار داخل الخريطة.';}catch(e){alert('تعذّر البحث: '+e.message)}finally{el('searchBtn').textContent='بحث'}}
async function route(){if(!loc||!dest){alert('اسمح للموقع وحدد الوجهة أولاً');return}el('routeBtn').textContent='...';try{let u=`https://router.project-osrm.org/route/v1/driving/${loc.lng},${loc.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;let r=await fetch(u);if(!r.ok)throw Error('خدمة المسارات غير متاحة');let d=await r.json();if(!d.routes || !d.routes.length)throw Error('لا يوجد مسار');routeResult=d.routes[0];if(routeLine)map.removeLayer(routeLine);routeLine=L.geoJSON(routeResult.geometry,{style:{color:'#11e6d7',weight:6,opacity:.9}}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[35,35]});follow=false;el('followBtn').textContent='تتبّع';el('mapNote').style.display='block';el('mapNote').textContent='المسافة '+(routeResult.distance/1000).toFixed(1)+' كم · الوقت المقدر '+Math.round(routeResult.duration/60)+' دقيقة. المسار داخل الخريطة (بدون إرشادات صوتية).';}catch(e){alert('لم يتوفر المسار: '+e.message)}finally{el('routeBtn').textContent='مسار داخل الخريطة'}}
el('searchBtn').onclick=search;el('routeBtn').onclick=route;el('destination').addEventListener('keydown',e=>{if(e.key==='Enter')search()});el('followBtn').onclick=()=>{follow=!follow;el('followBtn').textContent=follow?'تتبّع ✓':'تتبّع';if(loc&&follow&&map)map.setView([loc.lat,loc.lng],16)};el('northBtn').onclick=()=>{headingUp=!headingUp;el('northBtn').textContent=headingUp?'اتجاه السيارة':'اتجاه ↑';el('mapNote').style.display='block';el('mapNote').textContent='سهم السيارة يعرض الاتجاه. تدوير طبقة الخريطة غير مدعوم في هذا الإصدار.'};el('resetBtn').onclick=()=>{total=0;maxSpeed=0;last=null;lastSpeed=null;lastTime=null;el('distance').textContent='0.00 km'};el('themeBtn').onclick=()=>document.body.classList.toggle('light');
function playSc(){let s=el('scUrl').value.trim();try{let u=new URL(s);if(!(u.hostname==='soundcloud.com'||u.hostname.endsWith('.soundcloud.com')))throw Error();let frame=el('soundFrame');el('scFrame').src='https://w.soundcloud.com/player/?url='+encodeURIComponent(s)+'&auto_play=true&hide_related=true&show_comments=false';frame.classList.add('visible')}catch(e){alert('الصق رابط أغنية SoundCloud العامّة. البحث في مكتبة SoundCloud يتطلب API غير متوفر هنا.')}}el('playBtn').onclick=playSc;el('musicToggle').onclick=()=>el('soundFrame').classList.toggle('visible');init();startGps();
</script><script src="upgrade.js"></script><script src="neon-v2.js"></script><script src="navigation-v2.js"></script><script src="keyboard.js"></script><script src="motion.js"></script><script src="dj.js"></script></body></html>
