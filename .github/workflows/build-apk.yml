name: Build Siti GPS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK directly from Android sources
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy raw standalone APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SitiGPS-1.14-Separate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SitiGPS-1.14-Separate-APK
          path: SitiGPS-1.14-Separate.apk
          if-no-files-found: error
      - name: Publish direct-download APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create siti-gps-1.14 SitiGPS-1.14-Separate.apk --target "$GITHUB_SHA" --title "Siti GPS 1.14 Standalone" --notes "Fresh Android Gradle build from source. Separate package com.siti.gps.live so version 1.6 stays installed. This is a test build and does not replace existing Siti GPS installations." --latest
